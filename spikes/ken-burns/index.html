<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ken Burns spike — is zoompan fast enough?</title>
    <style>
      body { font: 14px/1.6 ui-monospace, monospace; max-width: 820px; margin: 40px auto; padding: 0 20px; background: #0d0e11; color: #e6e8ec; }
      h1 { font-size: 18px; }
      button { font: inherit; padding: 8px 16px; background: #22262e; color: #ffb339; border: 1px solid #ffb339; border-radius: 6px; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      table { border-collapse: collapse; margin-top: 20px; width: 100%; }
      th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #282c34; }
      td.n { text-align: right; font-variant-numeric: tabular-nums; }
      #log { white-space: pre-wrap; color: #9aa0ab; font-size: 12px; margin-top: 20px; }
      .verdict { margin-top: 20px; padding: 12px; border-radius: 8px; background: #1b1e24; }
    </style>
  </head>
  <body>
    <h1>Ken Burns spike — is <code>zoompan</code> fast enough in wasm?</h1>
    <p>
      Renders one 10s Still Beat segment (300 frames @ 30fps, 1920×1080 out) four ways
      through the app's own engine and self-hosted cores. Measures ADR-0015's pre-scale
      choice against the no-move baseline.
    </p>
    <button id="go">Run the spike</button>
    <div id="out"></div>
    <div id="log"></div>

    <script type="module">
      import { runIsolated, multithreadReady } from "/src/lib/ffmpegEngine.ts";

      const DUR = 10, FPS = 30, W = 1920, H = 1080;
      const FRAMES = DUR * FPS;
      const log = (m) => { document.getElementById("log").textContent += m + "\n"; };

      // A synthetic "photo" with fine detail, so scaler cost is realistic.
      function makeStill(w, h) {
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const x = c.getContext("2d");
        const g = x.createLinearGradient(0, 0, w, h);
        g.addColorStop(0, "#2b5876"); g.addColorStop(1, "#d76d77");
        x.fillStyle = g; x.fillRect(0, 0, w, h);
        for (let i = 0; i < 6000; i++) {
          x.fillStyle = `hsl(${(i * 37) % 360} 70% ${30 + (i % 50)}%)`;
          x.fillRect(Math.random() * w, Math.random() * h, 3, 3);
        }
        return new Promise((res) => c.toBlob((b) => b.arrayBuffer().then((a) => res(new Uint8Array(a))), "image/jpeg", 0.92));
      }

      // Linear zoompan over the frame index — the exact shape ADR-0015 specifies.
      const kb = (preW, preH, z0, z1) =>
        `scale=${preW}:${preH},zoompan=z='${z0}+(${z1}-${z0})*on/${FRAMES - 1}'` +
        `:x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=1:s=${W}x${H}:fps=${FPS}`;

      const CASES = [
        { name: "baseline (no move)", vf: `scale=${W}:${H}:force_original_aspect_ratio=decrease` },
        { name: "pre-scale 1.5× (2880w)", vf: kb(2880, 1620, 1.0, 1.35) },
        { name: "pre-scale 2× (3840w) — ADR-0015", vf: kb(3840, 2160, 1.0, 1.35) },
        { name: "no pre-scale (6000w raw)", vf: kb(6000, 3375, 1.0, 1.35) },
      ];

      document.getElementById("go").onclick = async (e) => {
        e.target.disabled = true;
        log(`multithread: ${multithreadReady()}`);
        log("building 6000px source still…");
        const still = await makeStill(6000, 3375);
        log(`source: ${(still.length / 1e6).toFixed(1)} MB\n`);

        const rows = [];
        for (const c of CASES) {
          log(`running: ${c.name}`);
          const args = [
            "-loop", "1", "-t", String(DUR), "-r", String(FPS), "-i", "in.jpg",
            "-vf", `${c.vf},pad=${W}:${H}:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p`,
            "-c:v", "libx264", "-preset", "superfast", "-crf", "18",
            "-an", "out.mp4",
          ];
          const t0 = performance.now();
          let ms = null, err = null, bytes = 0;
          try {
            const out = await runIsolated([{ name: "in.jpg", data: still }], args, "out.mp4");
            ms = performance.now() - t0;
            bytes = out.length;
          } catch (ex) { err = String(ex); }
          rows.push({ ...c, ms, err, bytes });
          log(err ? `  FAILED: ${err}` : `  ${(ms / 1000).toFixed(1)}s  (${(bytes / 1e6).toFixed(1)} MB)`);
        }

        const base = rows[0].ms;
        document.getElementById("out").innerHTML =
          `<table><tr><th>case</th><th>seconds</th><th>× realtime</th><th>× baseline</th></tr>` +
          rows.map((r) => r.err
            ? `<tr><td>${r.name}</td><td colspan="3">FAILED — ${r.err}</td></tr>`
            : `<tr><td>${r.name}</td><td class="n">${(r.ms / 1000).toFixed(1)}</td>` +
              `<td class="n">${(r.ms / 1000 / DUR).toFixed(2)}×</td>` +
              `<td class="n">${base ? (r.ms / base).toFixed(1) + "×" : "—"}</td></tr>`).join("") +
          `</table>` +
          `<div class="verdict"><b>Read it like this:</b> "× realtime" under ~1.0 means a 10s Still
           exports in under 10s of wall clock. The gap between 1.5× and 2× pre-scale is the
           jitter-vs-speed trade ADR-0015 is asking about. If 2× is much worse than 1.5×,
           drop the pre-scale and accept mild stepping on slow pans.</div>`;
      };
    </script>
  </body>
</html>
